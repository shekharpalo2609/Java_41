<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 450px;
            margin: 40px;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2 style="margin-left: 40px;">Students Table</h2>

    <table id="studentsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Marks</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>85</td>
                <td>Mumbai</td>
            </tr>
            <tr>
                <td>Alice</td>
                <td>92</td>
                <td>Pune</td>
            </tr>
            <tr>
                <td>Ravi</td>
                <td>78</td>
                <td>Delhi</td>
            </tr>
            <tr>
                <td>Emma</td>
                <td>88</td>
                <td>Bangalore</td>
            </tr>
            <tr>
                <td>Kabir</td>
                <td>95</td>
                <td>Chennai</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
